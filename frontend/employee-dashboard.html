<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teamgle — Employee Dashboard</title>
  <link rel="stylesheet" href="css/manager-dashboard.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

  <!-- ── Navbar ──────────────────────────────────────────────────────────── -->
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="../logo/Gemini_Generated_Image_x5zncpx5zncpx5zn.png" alt="Teamgle" />
    </div>
    <div class="navbar-info">
      <div class="navbar-chip">
        <span class="chip-label">Name</span>
        <span class="chip-value" id="info-name">—</span>
      </div>
      <div class="navbar-chip">
        <span class="chip-label">Role</span>
        <span class="chip-value" id="info-role">—</span>
      </div>
      <div class="navbar-chip">
        <span class="chip-label">Company</span>
        <span class="chip-value" id="info-company">—</span>
      </div>
    </div>
    <div class="navbar-user">
      <span id="nav-username">Loading…</span>
      <button class="btn-logout" id="btn-logout">Sign Out</button>
    </div>
  </nav>

  <!-- ── Sidebar reopen button ────────────────────────────────────────────── -->
  <button class="btn-sidebar-reopen" id="btn-sidebar-reopen" aria-label="Open sidebar">
    <i data-lucide="panel-left-open"></i>
  </button>

  <!-- ── Sidebar backdrop (mobile) ────────────────────────────────────────── -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- ── Body layout ──────────────────────────────────────────────────────── -->
  <div class="body-layout">

    <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <p class="sidebar-title">Menu</p>
        <button class="btn-hamburger" id="btn-hamburger">
          <i data-lucide="panel-left-close"></i>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item" data-section="offers">
          <i data-lucide="briefcase"></i>
          <span>Job Offers</span>
          <span class="offers-badge" id="offers-badge" style="display:none"></span>
        </a>
        <a href="#" class="nav-item" data-section="applications">
          <i data-lucide="clipboard-list"></i>
          <span>My Applications</span>
        </a>
        <a href="#" class="nav-item active" data-section="chats">
          <i data-lucide="message-square"></i>
          <span>Chats</span>
        </a>
      </nav>
    </aside>

    <!-- ── Page content ─────────────────────────────────────────────────────── -->
    <div class="page-content" id="page-content">

      <!-- Offers section -->
      <div class="page-section" id="section-offers" data-section="offers" style="display:none">
        <div class="offers-page">
          <div class="offers-page-header">
            <h2 class="offers-page-title">Job Offers</h2>
            <p class="offers-page-subtitle">Shifts waiting for your response</p>
          </div>
          <div id="offers-list"></div>
        </div>
      </div>

      <!-- Applications section -->
      <div class="page-section" id="section-applications" data-section="applications" style="display:none">
        <div class="offers-page">
          <div class="offers-page-header">
            <h2 class="offers-page-title">My Applications</h2>
            <p class="offers-page-subtitle">Shifts you've applied for and their statuses</p>
          </div>
          <div id="applications-list"></div>
        </div>
      </div>

      <!-- Chat section — fills the whole content area when active -->
      <div class="page-section" id="section-chats" data-section="chats">
        <!-- Chat UI injected here by employee-dashboard.js -->
      </div>

    </div>
  </div>

  <script type="module" src="js/employee-dashboard.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
