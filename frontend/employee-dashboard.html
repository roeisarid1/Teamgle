<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f6ef7" />
  <meta name="application-name" content="Teamgle" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Teamgle" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Teamgle — Employee Dashboard</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/teamgle-192.png" />
  <link rel="stylesheet" href="css/manager-dashboard.css?v=employee-drawer-fix" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

  <!-- ── Navbar ──────────────────────────────────────────────────────────── -->
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="../logo/Gemini_Generated_Image_x5zncpx5zncpx5zn.png" alt="Teamgle" />
    </div>
    <div class="navbar-info">
      <div class="navbar-chip">
        <span class="chip-label">Name</span>
        <span class="chip-value" id="info-name">—</span>
      </div>
      <div class="navbar-chip">
        <span class="chip-label">Role</span>
        <span class="chip-value" id="info-role">—</span>
      </div>
      <div class="navbar-chip">
        <span class="chip-label">Company</span>
        <span class="chip-value" id="info-company">—</span>
      </div>
    </div>
    <div class="navbar-user">
      <span id="nav-username">Loading…</span>
      <button class="btn-language-toggle" type="button" data-language-toggle>עברית</button>
      <button class="btn-logout" id="btn-logout">Sign Out</button>
    </div>
  </nav>

  <!-- ── Sidebar reopen button ────────────────────────────────────────────── -->
  <button class="btn-sidebar-reopen" id="btn-sidebar-reopen" aria-label="Open sidebar">
    <i data-lucide="panel-left-open"></i>
  </button>

  <!-- ── Sidebar backdrop (mobile) ────────────────────────────────────────── -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- ── Body layout ──────────────────────────────────────────────────────── -->
  <div class="body-layout">

    <!-- ── Sidebar ───────────────────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <p class="sidebar-title">Menu</p>
        <button class="btn-hamburger" id="btn-hamburger">
          <i data-lucide="panel-left-close"></i>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-section="my-shifts">
          <i data-lucide="calendar-check"></i>
          <span>My Shifts</span>
          <span class="offers-badge" id="shifts-badge" style="display:none"></span>
        </a>
        <a href="#" class="nav-item" data-section="chats">
          <i data-lucide="message-square"></i>
          <span>Chats</span>
        </a>
        <a href="#" class="nav-item" data-section="champions">
          <i data-lucide="trophy"></i>
          <span>Shift Champions</span>
        </a>
      </nav>
    </aside>

    <!-- ── Page content ──────────────────────────────────────────────────── -->
    <div class="page-content" id="page-content">

      <!-- My Shifts section -->
      <div class="page-section" id="section-my-shifts" data-section="my-shifts">
        <div class="offers-page">
          <div class="offers-page-header">
            <h2 class="offers-page-title">My Shifts</h2>
            <p class="offers-page-subtitle">All your shifts, offers, and briefings in one place</p>
          </div>

          <!-- Tab bar -->
          <div class="ms-tab-bar">
            <button class="ms-tab active" data-mstab="offers">
              Offered
              <span class="ms-tab-badge" id="ms-badge-offers" style="display:none"></span>
            </button>
            <button class="ms-tab" data-mstab="updates">
              Updates
              <span class="ms-tab-badge ms-tab-badge--alert" id="ms-badge-updates" style="display:none"></span>
            </button>
            <button class="ms-tab" data-mstab="approved">
              Approved
              <span class="ms-tab-badge" id="ms-badge-approved" style="display:none"></span>
            </button>
            <button class="ms-tab" data-mstab="history">
              History
              <span class="ms-tab-badge" id="ms-badge-history" style="display:none"></span>
            </button>
          </div>

          <!-- Tab panels -->
          <div id="ms-panel-offers"   class="ms-panel"></div>
          <div id="ms-panel-updates"  class="ms-panel" style="display:none"></div>
          <div id="ms-panel-approved" class="ms-panel" style="display:none"></div>
          <div id="ms-panel-history"  class="ms-panel" style="display:none"></div>
        </div>
      </div>

      <!-- Chat section -->
      <div class="page-section" id="section-chats" data-section="chats" style="display:none">
        <!-- Chat UI injected here -->
      </div>

      <!-- Shift Champions section -->
      <div class="page-section" id="section-champions" data-section="champions" style="display:none">
        <div id="gc-container"></div>
      </div>

    </div>
  </div>

  <script type="module" src="js/employee-dashboard.js?v=employee-drawer-fix"></script>
  <script src="js/register-sw.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
